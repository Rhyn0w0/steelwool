pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle download a matching JDK (25) when one is not installed locally.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'steelwool'

// A NeoForge mod built with NeoForge's own tooling, used by SteelWool's game tests.
includeBuild 'testmod'
