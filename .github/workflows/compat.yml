# Boots popular NeoForge mods (compat/mods.json) one at a time on a Fabric dedicated server with
# SteelWool and publishes a compatibility report in the run summary. Fails only if a mod marked
# "expect": "pass" stops loading.
name: compat
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays, to catch new mod releases

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build test bundle
        run: ./gradlew testBundle
      - name: Check NeoForge mods
        run: python3 compat/compat_check.py
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-report
          path: |
            build/compat/report.md
            build/compat/results.json
            build/compat/logs/
