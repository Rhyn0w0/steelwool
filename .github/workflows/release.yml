# Publishes a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds and tests the mod, then attaches the mod jar and the test bundle to the release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew build testBundle
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<NOTES
          ## Downloads

          - **steelwool-test-bundle-${VERSION}.zip**: everything needed to try SteelWool: the mod, Fabric API, the Fabric installer, a test NeoForge mod and \`INSTRUCTIONS.md\` (start there).
          - **steelwool-${VERSION}.jar**: just the mod. Needs Minecraft 26.3, Fabric Loader 0.20.1+ and Fabric API. Put NeoForge mods in \`mods/neoforge/\`.

          SteelWool is early: most NeoForge mods will not load yet. See the README's "What is supported" section.
          NOTES
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "SteelWool $VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            $prerelease \
            "build/libs/steelwool-${VERSION}.jar" \
            "build/distributions/steelwool-test-bundle-${VERSION}.zip"
